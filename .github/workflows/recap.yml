name: recap

# File-first recap generation. This workflow reads config/recaps.toml, scans
# newly added wiki/*/sources/*.md notes in each due calendar window, writes
# recaps/<profile>/<date>.md plus recaps/manifests/<run-date>.json, and commits
# only recaps/. The bundled Slack adapter consumes the committed manifest; it
# does not synthesize recap knowledge.
#
# Source-repo policy: this workflow stays disabled in sergedoub/bowerbird. It is
# checked in so installed private instance repositories can enable it during setup.

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["compile-wiki"]
    types: [completed]

permissions:
  contents: write

concurrency:
  # All instance workflows that push main share this lock to avoid non-fast-forward races.
  group: bowerbird-repository-writer
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.repository != 'sergedoub/bowerbird' && vars.BOWERBIRD_LIVE_INSTANCE == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Resolve recap provider
        id: provider
        run: |
          provider="$(PYTHONPATH=src python3 - <<'PY'
          from pathlib import Path
          from bowerbird.model_config import parse_model_config

          path = Path("config/models.toml")
          stage = parse_model_config(path.read_text()).recap
          print("openrouter" if stage.route == "openrouter" else stage.provider)
          PY
          )"
          case "$provider" in
            openai|anthropic|gemini|openrouter) ;;
            *) echo "Unknown recap provider: $provider" >&2; exit 64 ;;
          esac
          echo "name=$provider" >> "$GITHUB_OUTPUT"

      - name: Generate recap files with OpenAI
        if: ${{ steps.provider.outputs.name == 'openai' }}
        timeout-minutes: 10
        env:
          BOWERBIRD_MODEL_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 bin/recap.py

      - name: Generate recap files with Anthropic
        if: ${{ steps.provider.outputs.name == 'anthropic' }}
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOWERBIRD_MODEL_PROVIDER: anthropic
        run: python3 bin/recap.py

      - name: Generate recap files with Gemini
        if: ${{ steps.provider.outputs.name == 'gemini' }}
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 bin/recap.py

      - name: Generate recap files with OpenRouter
        if: ${{ steps.provider.outputs.name == 'openrouter' }}
        timeout-minutes: 10
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 bin/recap.py

      - name: Commit recap files
        id: commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain -- recaps)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recaps
            git commit -m "recap: generate files for $(date -u +%Y-%m-%d)"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No recap changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deliver Slack recaps
        if: steps.commit.outputs.changed == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 bin/slack_recap.py
