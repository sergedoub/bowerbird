name: search-dump

# X Recent Search monitors -> raw/searches/<monitor>/.
# This uses the same app-only X_BEARER_TOKEN as account-dump and commits only
# append-only raw search snapshots. Downstream compile/recap chaining remains
# workflow_run-based like the other ingest workflows.
#
# Source-repo policy: this workflow stays disabled in sergedoub/bowerbird. It is
# checked in so installed private instance repositories can enable it during setup.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      name:
        description: "Optional single search monitor to import"
        required: false
        type: string
      max_results:
        description: "Optional cap for this run"
        required: false
        type: string
      max_pages:
        description: "Optional page cap for this run"
        required: false
        type: string
      lookback_hours:
        description: "Optional first-run lookback override"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # All instance workflows that push main share this lock to avoid non-fast-forward races.
  group: bowerbird-repository-writer
  cancel-in-progress: false

jobs:
  dump:
    # Mutating search ingest is forbidden in the public source repo and requires
    # an installed private instance repo marked as live, including manual runs.
    if: ${{ github.repository != 'sergedoub/bowerbird' && vars.BOWERBIRD_LIVE_INSTANCE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Check search dump setup
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "X_BEARER_TOKEN is not configured. Finish setup or set the repository secret before running search-dump." >&2
            exit 1
          fi

      - name: Dump configured searches
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NAME: ${{ github.event.inputs.name || '' }}
          MAX_RESULTS: ${{ github.event.inputs.max_results || '' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '' }}
        run: |
          args=()
          if [ -n "$NAME" ]; then
            args+=(--name "$NAME")
          fi
          if [ -n "$MAX_RESULTS" ]; then
            args+=(--max-results "$MAX_RESULTS")
          fi
          if [ -n "$MAX_PAGES" ]; then
            args+=(--max-pages "$MAX_PAGES")
          fi
          if [ -n "$LOOKBACK_HOURS" ]; then
            args+=(--lookback-hours "$LOOKBACK_HOURS")
          fi
          python3 bin/dump_search.py "${args[@]}"

      - name: Commit any new raw files
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain raw/searches)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add raw/searches
            git commit -m "chore: dump new search posts"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            echo "No new search posts."
          fi
