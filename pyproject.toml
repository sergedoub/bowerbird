[project]
name = "bowerbird"
version = "0.1.0"
description = "Personal LLM-compiled knowledge base (Karpathy-style markdown wiki) fed by X bookmarks."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["bandit==1.9.4", "pytest>=8", "pytest-cov>=7", "ruff==0.16.0"]

[project.scripts]
bowerbird = "bowerbird.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["bowerbird"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
